name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate repository structure and manifests
        run: node scripts/validate-repo.mjs
      - name: Run validator unit tests
        run: node --test scripts/validate-repo.test.mjs
